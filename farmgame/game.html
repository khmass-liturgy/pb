<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">   <!-- 폰 다크모드/강제 다크가 계사 색을 바꾸지 않게 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>꼬꼬 농장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 화면 농장 — 위 HUD, 가운데 살아 움직이는 계사 장면, 아래 관리 패널. 파스텔 단일 테마 */
:root{
  --sky:#BFE9F5; --mint:#D6F2E3; --straw:#FFE08A; --coral:#FF7F6E; --ink:#3A3658; --leaf:#7CC67E;
  --card:#FFFFFF; --soft:#F3F6FB; --line:#E2E6F0; --muted:#7D7A99; --wood:#E7B98A; --wood2:#D9A372;
  --good:#3FAF6A; --warn:#F2A33A; --bad:#E5534B;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:#EAF7FB;color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  background:radial-gradient(circle at 10% 0%,#FFF6D6 0,transparent 40%),radial-gradient(circle at 100% 30%,#DDF3E6 0,transparent 45%),#EAF7FB}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:38px;height:38px}
.brand h1{font-size:24px;letter-spacing:.5px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.iconbtn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:6px 10px;font-family:var(--f-display);font-size:14px;box-shadow:0 3px 0 var(--ink)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.stat .v{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--good);transition:width .6s,background .6s}
@media (max-width:520px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 장면 */
.scene{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:24px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood2) 46px 49px)}
.window{position:absolute;left:8%;top:7%;width:30%;height:30%;border:5px solid #FFF8EC;border-radius:14px;overflow:hidden;background:linear-gradient(#9FDCF1,#DFF5FB);box-shadow:inset 0 0 0 3px #C88F5C}
.window::before,.window::after{content:"";position:absolute;background:#FFF8EC;z-index:3}
.window::before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}
.window::after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.sun{position:absolute;width:34%;aspect-ratio:1;border-radius:50%;background:#FFD54A;left:58%;top:18%;box-shadow:0 0 0 6px #FFE89A80;transition:background .8s,transform 1.2s}
.cloud{position:absolute;height:18%;width:40%;background:#fff;border-radius:40px;top:55%;left:-40%;animation:drift 18s linear infinite;opacity:.95}
.cloud.c2{top:30%;animation-duration:26s;animation-delay:-9s;width:30%}
@keyframes drift{to{left:110%}}
.hot .window{background:linear-gradient(#FFB27A,#FFE3B0)}
.hot .sun{background:#FF6B4A;box-shadow:0 0 0 8px #FF9B7A90;transform:scale(1.15)}
.sign{position:absolute;right:3%;top:3%;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#FFF8EC;border:3px solid var(--ink);border-radius:12px;padding:3px 9px;font-family:var(--f-display);font-size:clamp(11px,2.5vw,16px);transform:rotate(2deg);z-index:210}
.lamp{position:absolute;left:46%;top:0;width:7%;height:36%}
.lamp .cord{position:absolute;left:50%;top:0;width:3px;height:60%;background:var(--ink);margin-left:-1.5px}
.lamp .bulb{position:absolute;left:0;right:0;top:56%;aspect-ratio:1;border-radius:50% 50% 45% 45%;background:#FFB34D;border:3px solid var(--ink);transition:box-shadow .6s,background .6s}
.floor{position:absolute;left:0;right:0;bottom:0;height:52%;border-top:4px solid #B98457;transition:background 1s;
  background-color:var(--floor,#F6D57E);
  background-image:radial-gradient(#ffffff70 1.5px,transparent 2px),radial-gradient(#00000012 1.5px,transparent 2px);background-size:22px 18px,30px 26px;background-position:0 0,11px 9px}
.feeder,.waterer{position:absolute;bottom:33%;width:18%;aspect-ratio:1;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 2px #0003)}
.feeder{left:6%}.waterer{left:28%}
.haze{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,#B7C96A,transparent 70%);opacity:0;pointer-events:none;transition:opacity 1s;mix-blend-mode:multiply}
.nightveil{position:absolute;inset:0;background:#1F2350;opacity:0;pointer-events:none;transition:opacity .55s;z-index:40}
.moon{position:absolute;right:12%;top:10%;width:9%;aspect-ratio:1;border-radius:50%;box-shadow:-10px 4px 0 0 #FFF4B8;opacity:0;transition:opacity .5s;z-index:41}
.scene.night .nightveil{opacity:.62}.scene.night .moon{opacity:1}
.zzz{position:absolute;inset:0;z-index:42;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:#FFF4B8;font-size:clamp(20px,5vw,34px);opacity:0;transition:opacity .4s}
.scene.night .zzz{opacity:1}
#flock{position:absolute;inset:0;z-index:5}
.hen{position:absolute;transform-origin:50% 100%;will-change:left,top}
.hen svg{width:100%;height:auto;display:block;overflow:visible}
.hen .flip{transition:transform .25s}
.hen.left .flip{transform:scaleX(-1)}
.hen .legs path{stroke:#F39A2B;stroke-width:2.6;stroke-linecap:round;fill:none}
.hen.walk .l1{animation:stepA .32s infinite alternate}
.hen.walk .l2{animation:stepA .32s infinite alternate-reverse}
@keyframes stepA{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.hen.walk .bodyg{animation:bob .32s infinite alternate}
@keyframes bob{to{transform:translateY(-1.6px)}}
.hen .head{transform-box:fill-box;transform-origin:30% 90%;transform:scale(var(--hs,1));transition:transform .25s}
.hen.peck .head{animation:peck .5s ease-in-out 2}
@keyframes peck{50%{transform:scale(var(--hs,1)) rotate(38deg) translate(3px,5px)}}
.hen .eye{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.hen .eye{transform-box:fill-box;transform-origin:center}
.hen.pant .beakopen{opacity:1}
.hen .beakopen{opacity:0}
.bubble{position:absolute;left:50%;bottom:92%;transform:translateX(-50%) scale(.3);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 5px;font-size:12px;line-height:20px;white-space:nowrap;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.nest{position:absolute;left:4%;right:4%;bottom:3%;height:13%;background:#C98A55;border:3px solid var(--ink);border-radius:12px;z-index:30;display:flex;align-items:center;gap:4%;padding:0 4%;overflow:hidden}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.2)}}
.particle{position:absolute;z-index:150;pointer-events:none;font-size:36px;line-height:1;filter:drop-shadow(0 2px 2px #0003);animation:rise 1.4s ease-out forwards}
@keyframes rise{to{transform:translateY(-100px);opacity:0}}

/* 패널 */
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:18px}
.tip{background:var(--mint);border-radius:14px;padding:8px 12px;font-size:14px}
.tip b{font-family:var(--f-display);font-weight:400}
.ctrls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.ctrls{grid-template-columns:minmax(0,1fr)}}
.ctrl{background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ctrl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.ctrl .lab span:first-child{font-family:var(--f-display);font-size:15px}
.ctrl .lab .hint{color:var(--muted);font-size:12px;text-align:right}
.seg{display:flex;gap:4px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:11px;padding:6px 2px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--straw);border-color:var(--ink);font-family:var(--f-display)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:34px;border:2px solid var(--ink);border-radius:11px;background:#fff;font-family:var(--f-display);font-size:18px}
.stepper output{flex:1;text-align:center;font-family:var(--f-display);font-size:20px}
.mini{border:2px dashed var(--ink);background:#fff;border-radius:11px;padding:6px;font-size:13px}
.gobtn{width:100%;border:3px solid var(--ink);background:var(--coral);color:#fff;border-radius:18px;padding:13px;font-family:var(--f-display);font-size:21px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 #00000025}
.gobtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.gobtn:disabled{filter:grayscale(.6);opacity:.7}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.two{grid-template-columns:minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.chart .cap i{display:inline-block;width:12px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.log li{display:flex;gap:8px;min-width:0}
.log li b{font-family:var(--f-display);font-weight:400;color:var(--muted);flex:none;min-width:44px}
.log li span{min-width:0}

/* 모달 */
.modal{position:fixed;inset:0;z-index:1000;background:#3A365888;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:pop .35s}
.sheet h2{font-size:23px}
.sheet p{margin:0}
.ev-icon{font-size:40px;line-height:1}
.choice{text-align:left;border:2px solid var(--ink);background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.choice:hover{background:#FFF3C8}
.choice b{font-family:var(--f-display);font-weight:400;font-size:16px}
.choice small{color:var(--muted)}
.result{background:var(--mint);border-radius:14px;padding:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.field input{border:2px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1;min-width:120px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:9px 12px;font-family:var(--f-display);font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn.primary{background:var(--straw)}
.note{font-size:12.5px;color:var(--muted)}
.gmsg{min-height:1.4em;font-size:13.5px}
.nickline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px}
.nickline b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--coral)}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:8px 10px;min-width:0}
.slot.me{background:#FFF3C8;border:2px solid var(--ink)}
.slot .who{flex:1;min-width:0}
.slot .who b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.slot .who small{color:var(--muted);font-size:12px;display:block;overflow-wrap:anywhere}
.slot button{flex:none;padding:6px 10px;font-size:13px}
.cloudnote{font-size:12px;color:var(--muted);text-align:right;min-height:1.2em}
@media (max-width:520px){.top{flex-wrap:wrap}.top .row{width:100%}.top .row>button{min-width:0}}

/* 시작 화면 */
.start{display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.hero h1{font-size:clamp(34px,9vw,52px);line-height:1.05;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.picks{grid-template-columns:minmax(0,1fr)}}
.picks.one{grid-template-columns:minmax(0,520px);justify-content:center}
.pick[hidden]{display:none}
.pick{border:3px solid var(--ink);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--ink);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.pick:hover{transform:translateY(-3px) rotate(-.5deg)}
.pick .pic{height:110px;border-radius:16px;position:relative;overflow:hidden}
.pick.b .pic{background:linear-gradient(#FFF1B8,#FFE08A)}
.pick.l .pic{background:linear-gradient(#DDF3E6,#B8E6C9)}
.pick h2{font-size:24px}
.pick dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13.5px}
.pick dt{color:var(--muted)}
.pick dd{margin:0}
.pick .go{align-self:flex-start;background:var(--coral);color:#fff;border-radius:12px;padding:5px 12px;font-family:var(--f-display);border:2px solid var(--ink)}
.pick .pic .hen{position:absolute}
.records{font-size:13px;color:var(--muted);text-align:center}
.grade{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--coral);text-align:center}
.rep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rep .stat .v{font-size:21px}
.fb{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;opacity:0;transition:.3s;z-index:1200;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){
  .cloud,.hen.walk .l1,.hen.walk .l2,.hen.walk .bodyg,.hen .eye,.particle{animation:none}
  .egg,.sheet{animation:none}
}

.guide{gap:10px}
.guide h2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.guide h2 small{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.chip{background:var(--soft);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip .k{font-size:12px;color:var(--muted)}
.chip .v{font-size:19px;font-family:var(--f-display)}
.chip .s{font-size:12px;color:var(--muted)}
.wx{background:var(--mint);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.55}
.wx .big{font-size:22px;vertical-align:middle;margin-right:4px}
.wx small{display:block;color:var(--muted);font-size:12px}
.pts{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.guide details{font-size:13px}
.guide summary{cursor:pointer;color:var(--muted);padding:4px 0}
.gt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.gt th,.gt td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.gt tr.now{background:var(--straw)}
.ctrl.wide{grid-column:1/-1}
.fdopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.fdopts button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:6px 4px;font-size:13px;display:flex;flex-direction:column;gap:1px;align-items:center;line-height:1.3}
.fdopts button small{font-size:11px;color:var(--muted)}
.fdopts button[aria-pressed="true"]{background:var(--straw);border-color:var(--ink)}
.fdopts button.rec::before{content:'★ 지금 권장';font-size:11px;color:#C77700}

.adm{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.adm h3{margin:6px 0 0;font-size:16px}
.adm .row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.adm input[type=number]{width:58px;border:2px solid var(--line);border-radius:9px;padding:5px;font-size:14px}
.adm input[type=text],.adm textarea,.adm select{border:2px solid var(--line);border-radius:9px;padding:6px;font-size:14px;font-family:inherit;width:100%;box-sizing:border-box}
.adm textarea{min-height:62px}
.adm .stg{background:var(--soft);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.adm .dzr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:6px 8px}
.adm .dzr b{flex:1;min-width:120px}

.rcol{position:absolute;right:2%;top:12%;bottom:3%;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:200;pointer-events:none}
.rcol>*{pointer-events:auto}
.acts{display:flex;flex-direction:column;gap:4px}
.act{width:60px;background:linear-gradient(to top,var(--gc,#BFE8B8) var(--lv,0%),#FFFFFFEE var(--lv,0%));border:2px solid var(--ink);border-radius:14px;background:#FFFFFFEE;box-shadow:0 3px 0 var(--ink);padding:2px 2px 3px;font-family:var(--f-display);font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}
.act .r{display:flex;align-items:center;gap:2px;white-space:nowrap}
.act .em{font-size:14px}
.act small{font-size:9.5px;color:var(--muted);font-family:inherit}
.acts[hidden]{display:none}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.window{transition:background .8s}
.window .fx{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .8s}
.window.wx-pcloud .sun{opacity:.9}
.window.wx-cloudy{background:linear-gradient(#B9C5CD,#DEE4E8)}
.window.wx-cloudy .sun{opacity:.22}
.window.wx-fog{background:linear-gradient(#D5DDE1,#EEF2F4)}
.window.wx-fog .sun{opacity:.3}
.window.wx-fog .fx{opacity:.65;background:linear-gradient(#F4F7F8,#E2E8EB)}
.window.wx-rain,.window.wx-storm{background:linear-gradient(#7C8B96,#AAB6BF)}
.window.wx-storm{background:linear-gradient(#545F6B,#8793A0)}
.window.wx-rain .sun,.window.wx-storm .sun,.window.wx-snow .sun{opacity:0}
.window.wx-rain .cloud,.window.wx-storm .cloud{background:#CBD3D9}
.window.wx-rain .fx,.window.wx-storm .fx{opacity:1;background:repeating-linear-gradient(105deg,transparent 0 7px,#FFFFFFAA 7px 8px);background-size:22px 22px;animation:rainfall .45s linear infinite}

(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const won=v=>(v<0?'-':'')+'₩'+Math.round(Math.abs(v)).toLocaleString('ko-KR');
const fmt=v=>Math.round(v).toLocaleString('ko-KR');
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const rnd=Math.random;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function interp(pts,x){
  if(x<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(x-x0)/(x1-x0)}}
  return pts[pts.length-1][1];
}
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ── 모델 기준값 (실제 원리를 단순화) ── */
const STD_W=[[0,42],[7,190],[14,480],[21,950],[28,1550],[33,2100]];     // 육계 표준 체중(g)
const LAY=[[17,0],[18,.05],[19,.22],[20,.52],[21,.76],[22,.88],[24,.93],[30,.93],[40,.885]]; // 표준 산란율
const stdW=d=>interp(STD_W,d);
const recTemp=d=>33-12*(d-1)/32;
const recLight=w=>w<=1?20:w<=6?20-2*(w-1):w<=17?10:Math.min(16,10+(w-17));
/* ── 일령·주령별 가이드(교육용 참고값 — 품종 관리지침·사료회사 기준이 우선) ── */
const recTempL=w=>w<=1?33:w<=4?33-3*(w-1):w<18?22:21;
function envRec(mode,d){
  if(mode==='broiler'){const t=recTemp(d);return{t:Math.round(t),lo:Math.round(t-1),hi:Math.round(t+1),rh:d<=3?[60,70]:d<=14?[55,65]:[50,60]}}
  const t=recTempL(d);
  return d>=18?{t,lo:18,hi:24,rh:[50,70],light:recLight(d)}:{t,lo:t-1,hi:t+1,rh:d<=2?[60,70]:[50,70],light:recLight(d)};
}
const GSTAGES={
 broiler:[
  {from:1,to:3,name:'입추 직후',pts:['바닥(깔짚) 온도 확인 — 병아리 발이 따뜻해야 해요','사료·물을 바로 먹는지, 모이는 위치가 고른지 관찰','병아리가 한쪽에 몰리면 온도·외풍 점검']},
  {from:4,to:7,name:'육추 전반',pts:['1주령 체중이 표준(약 190g)에 닿는지 확인','환기는 적게 시작하되 암모니아 냄새를 매일 체크','온도는 하루 0.5℃씩 서서히 낮추기']},
  {from:8,to:14,name:'육추 후반',pts:['깔짚 상태·급수 라인 누수 점검','환기량을 조금씩 늘리기','백신 일정은 수의사 지시대로 확인']},
  {from:15,to:21,name:'성장 초기',pts:['깔짚 습기·암모니아 관리 — 환기 늘리기','물 섭취가 갑자기 줄면 이상 신호','급이기·급수기 높이를 닭 등 높이에 맞추기']},
  {from:22,to:28,name:'성장 후기',pts:['더위에 약해지는 시기 — 환기·쿨링 미리 준비','폐사·기침·묽은 변을 매일 확인','25일령쯤 후기 사료로 바꿀 시점']},
  {from:29,to:33,name:'출하 준비',pts:['출하 전 사료 중단 시점과 휴약기간 확인','출하 전 폭염·밀도 스트레스 대비','출하 체중·사료요구율 기록']}],
 layer:[
  {from:1,to:6,name:'육추기',pts:['온도는 주 3℃씩 낮추기(33℃ 시작)','점등은 길게 시작해 10시간까지 줄이기','1주령 체중·균일도 확인']},
  {from:7,to:15,name:'육성기',pts:['점등 10시간 유지 — 늘리지 않기','체중 균일도 점검, 작은 닭은 따로 관리','백신·부리 관리 일정 확인']},
  {from:16,to:17,name:'산란 준비',pts:['산란 준비 사료로 바꿔 칼슘 올리기','체중이 표준에 도달했는지 확인','18주 점등 자극 준비']},
  {from:18,to:29,name:'산란 전기',pts:['점등을 주 1시간씩 늘려 16시간까지','산란율 상승기 — 사료·물 부족 금지','칼슘 보충과 집란 횟수 늘리기']},
  {from:30,to:40,name:'산란 후기',pts:['산란율 하락이 급하면 원인부터 점검','난각 품질 — 칼슘 입자·집란 관리','폭염·소음 같은 스트레스 줄이기']}]
};
const gStage=(mode,d)=>GSTAGES[mode].find(g=>d>=g.from&&d<=g.to)||GSTAGES[mode][GSTAGES[mode].length-1];
/* 구간별 사료 */
const FEEDS={
 broiler:[

};
const feedRecIdx=(mode,d)=>{const L=FEEDS[mode];const i=L.findIndex(f=>d>=f.from&&d<=f.to);return i<0?L.length-1:i};
function feedFx(d){
  const L=FEEDS[S.mode],rec=feedRecIdx(S.mode,d);
  let ci=L.findIndex(f=>f.id===S.ctrl.fd);if(ci<0)ci=rec;
  const diff=ci-rec,a=Math.abs(diff),fx={ci,rec,diff,g:1,br:0,h:0,b:0,price:L[ci].price,msg:''};
  if(diff===0) return fx;
  if(S.mode==='broiler'){
    if(diff>0){fx.g=1-.06*a;fx.msg=`${L[ci].name}는 아직 일러요. 영양이 모자라 덜 자라요 — ${L[rec].name}로 바꿔요.`}
    else{fx.msg=`${L[ci].name}는 이 시기엔 값만 비싸요 — ${L[rec].name}로 바꿔요.`}
  } else {
    const laying=d>=18;
    if(diff>0){
      if(laying){fx.g=1-.03*a;fx.msg=`${L[ci].name}는 이 시기 산란에 영양이 모자라요 — ${L[rec].name}로 바꿔요.`}
      else{fx.h=-2*a;fx.msg=`${L[ci].name}는 칼슘이 높아 어린 닭에게 부담이에요 — ${L[rec].name}로 바꿔요.`}
    } else {
      if(laying){fx.g=1-.07*a;fx.br=.02*a;fx.msg=`${L[ci].name}는 칼슘이 모자라 산란율이 떨어지고 껍데기가 약해져요 — ${L[rec].name}로 바꿔요.`}
      else{fx.b=a;fx.msg=`${L[ci].name}는 이 시기엔 값만 비싸고 살이 쉽게 쪄요 — ${L[rec].name}로 바꿔요.`}
    }
  }
  return fx;
}
function noteFeed(fx){
  const key=fx.ci+':'+fx.rec;
  if(S.fdKey===key) return;
  S.fdKey=key;
  if(fx.diff!==0) addLog(fx.msg);
  else if(S.fdBad) addLog('사료를 이 시기에 맞게 바꿨어요. 👍');
  S.fdBad=fx.diff!==0;
}

const MODES={
  broiler:{name:'육계 키우기',maxDay:33,birds:1000,chick:650,start:3000000,unit:'일령'},
  layer:{name:'산란계 키우기',maxDay:40,birds:1000,chick:1200,start:6000000,unit:'주령'}
};

let S=null;
// 닉네임마다 기록·이어하기가 따로 저장된다(같은 기기에서 여러 사람이 해도 섞이지 않게).

const SUF={broiler:'@b',layer:'@l'};

const baseName=n=>String(n||'').replace(/@[bl]$/,'');
const ownSlot=x=>!LOCK||String(x.nickname||'').endsWith(SUF[LOCK])||(!/@[bl]$/.test(x.nickname||'')&&x.mode===LOCK);
const lsKeyN=b=>NICK?b+':'+NICK:b;
const lsKey=b=>lsKeyN(b)+(LOCK?'#'+LOCK:'');
const emptyR=()=>({broiler:{best:null,plays:0},layer:{best:null,plays:0}});

function newGame(mode){
  const M=MODES[mode];
  S={v:1,mode,day:0,alive:M.birds,birds0:M.birds,money:M.start-M.birds*M.chick,start:M.start,
    health:90,weight:mode==='broiler'?42:40,litter:100,feedLv:100,waterLv:100,ventLv:60,feedCut:false,ammonia:4,feedPrice:mode==="broiler"?650:520,basePrice:mode==="broiler"?650:520,
    salePrice:1900,eggPrice:180,bodyCond:80,early:0,rate:0,eff:33,
    ctrl:mode==='broiler'?{feed:2,water:2,temp:33,vent:1,fd:'pre'}:{feed:2,water:2,light:20,vent:1,calcium:0,fd:'brood'},
    fx:{},tot:{feedKg:0,feedCost:0,other:0,chick:M.birds*M.chick,revenue:0,eggs:0,good:0,rateSum:0,layWeeks:0,deaths:0},
    hist:[],log:[],done:false};
  addLog(mode==='broiler'?'병아리 1,000수가 도착했어요. 첫 주는 따뜻하게!':'산란계 병아리 1,000수 입추. 18주까지 몸을 잘 만들어 줘요.');
}
function addLog(t){S.log.unshift({d:S.day,t});S.log=S.log.slice(0,8)}

/* ── 사료통·물통·환기: 깔짚처럼 시간이 지나면 줄고, 터치로 채우거나 가동한다 ── */
const FEED_DROP=55,WATER_DROP=45,VENT_DROP=30;
function ensureGauges(){if(S.feedLv==null){S.feedLv=100;S.waterLv=100;S.ventLv=60;S.feedCut=false}if(S.ctrl.hum==null)S.ctrl.hum=S.mode==='layer'?60:65;if(S.ctrl.temp==null)S.ctrl.temp=S.mode==='layer'?envRec('layer',Math.min(MODES.layer.maxDay,Math.max(1,S.day+1))).t:33}
function useGauges(){
  ensureGauges();
  const c=S.ctrl,fc=clamp(S.feedLv/FEED_DROP,0,1),wc=clamp(S.waterLv/WATER_DROP,0,1);
  c.feed=(fc<.85||S.feedCut)?1:2;
  c.water=wc<.85?1:2;
  c.vent=S.ventLv<34?1:S.ventLv<67?2:3;
  if(fc<.85&&!S.feedCut) addLog('사료통이 비었어요! 닭들이 굶었어요. 하루 보내기 전에 급이해 주세요.');
  if(wc<.85) addLog('물통이 비었어요! 닭들이 목말라해요. 급수해 주세요.');
}
function decayGauges(){
  S.feedLv=Math.max(0,S.feedLv-FEED_DROP);S.waterLv=Math.max(0,S.waterLv-WATER_DROP);S.ventLv=Math.max(0,S.ventLv-VENT_DROP);
  S.suppOn=false;      // 영양제 효과는 다음 한 번(하루/한 주)만
}

/* ── 하루(육계) ── */
function stepBroiler(){
  const d=S.day+1,c=S.ctrl,fx=S.fx;
  useGauges();
  const target=recTemp(d);
  const outside=fx.heat>0?34:19+Math.sin(d/4)*2;
  let eff=Math.max(c.temp,outside);
  if(fx.heat>0) eff=outside-(c.vent-1)*1.5-(fx.cool?5:0);
  else if(c.vent===3&&d<14) eff-=2;
  S.eff=eff;
  const tdev=Math.abs(eff-target);
  const rh=envRec('broiler',d).rh,hd=c.hum<rh[0]?rh[0]-c.hum:c.hum>rh[1]?c.hum-rh[1]:0,wet=c.hum>rh[1]+5;
  if(hd>=10&&rnd()<.5)addLog(c.hum>rh[1]?'습도가 높아요. 깔짚이 눅눅해지고 암모니아가 올라가요.':'습도가 낮아요. 먼지가 날려 호흡기에 부담이에요.');
  S.litter=clamp(S.litter-(2.2+d*.07+(c.water===1?0:.4)+(wet?.8:0)),0,100);
  S.ammonia=clamp((100-S.litter)*.42+d*.3-(c.vent-1)*10+(wet?3:0),0,60);
  let stress=tdev*3.5+hd*.3+Math.max(0,S.ammonia-20)+(c.water===1?18:0)+(c.feed===1?4:0)+(fx.disease>0?fx.sev:0);
  if(fx.heat>0&&fx.vit) stress*=.6;
  if(S.suppOn) stress*=.8;
  S.health=clamp(S.health+(stress<12?3:-(stress-12)*.35),0,100);
  const base=stdW(d)-stdW(d-1);
  const feedF=[.84,1,1.06][c.feed-1],useF=[.84,1,1.14][c.feed-1];
  const ff=feedFx(d);noteFeed(ff);
  const gain=ff.g*base*feedF*(c.water===1?.8:1)*(.5+.5*S.health/100)*(tdev>3?.88:1)*(S.ammonia>25?.93:1);
  S.weight+=gain;
  const intake=base*(1.05+d*.017)*useF*(1+(100-S.health)/300);
  const feedKg=S.alive*intake/1000;
  const price=(fx.lock>0?S.basePrice:S.feedPrice)*ff.price;
  const heatCost=Math.max(0,c.temp-outside)*400, ventCost=0;
  S.tot.feedKg+=feedKg;S.tot.feedCost+=feedKg*price;S.tot.other+=heatCost+ventCost;
  S.money-=feedKg*price+heatCost+ventCost;
  const mort=.0004+(100-S.health)*.00008+(fx.disease>0?fx.sev*.00025:0)+(tdev>5?.002:0);
  const dead=Math.min(S.alive,Math.floor(S.alive*mort+rnd()));
  S.alive-=dead;S.tot.deaths+=dead;
  S.day=d;
  S.hist.push({x:d,a:S.weight,s:stdW(d)});
  if(dead>=5) addLog(`폐사 ${dead}수. 스트레스 요인을 점검해요.`);
  if(tdev>4) addLog(eff>target?`계사가 너무 더워요 (${eff.toFixed(0)}℃). 헐떡이는 닭이 많아요.`:`계사가 추워요 (${eff.toFixed(0)}℃). 병아리들이 한 곳에 몰려요.`);
  if(S.ammonia>25&&rnd()<.5) addLog(`암모니아 ${S.ammonia.toFixed(0)}ppm. 눈이 따가워요. 환기·깔짚을 챙겨요.`);
  decayGauges();tick();
  if(d>=MODES.broiler.maxDay){
    const rev=S.alive*S.weight/1000*S.salePrice;
    S.tot.revenue+=rev;S.money+=rev;S.done=true;
    addLog(`출하! ${fmt(S.alive)}수 × ${(S.weight/1000).toFixed(2)}kg = ${won(rev)}`);
  }
}

/* ── 한 주(산란계) ── */
function stepLayer(){
  const w=S.day+1,c=S.ctrl,fx=S.fx;
  useGauges();
  const recL=recLight(w), growing=w<18;
  const ff=feedFx(w);noteFeed(ff);
  const rh=envRec('layer',w).rh,hd=c.hum<rh[0]?rh[0]-c.hum:c.hum>rh[1]?c.hum-rh[1]:0;
  if(hd>=10&&rnd()<.5)addLog(c.hum>rh[1]?'습도가 높아요. 깔짚·계분이 눅눅해지고 암모니아가 올라가요.':'습도가 낮아요. 먼지가 날려 호흡기에 부담이에요.');
  S.litter=clamp(S.litter-(7+(c.hum>rh[1]+5?4:0)),0,100);
  S.ammonia=clamp(14+w*.25-(c.vent-1)*8+(c.hum>rh[1]+5?2:0)+(100-S.litter)*.12,0,50);
  const heatStress=fx.heat>0?(fx.cool?4:18-(c.vent-1)*4):(c.vent===1&&w>=18?3:0);
  const outsideL=19+Math.sin(w/4)*2,recT=envRec('layer',w).t;
  S.eff=fx.heat>0?(fx.cool?27:33-(c.vent-1)):Math.max(c.temp,outsideL);
  const tdevL=fx.heat>0?0:Math.abs(S.eff-recT);
  if(tdevL>3&&rnd()<.5)addLog(S.eff>recT?`계사가 너무 더워요(${S.eff.toFixed(0)}℃). 권장은 ${recT}℃예요.`:`계사가 추워요(${S.eff.toFixed(0)}℃). 권장은 ${recT}℃예요.`);
  let stress=heatStress+Math.max(0,tdevL-1)*2.2+hd*.25+Math.max(0,S.ammonia-20)+(c.water===1?20:0)+(c.feed===1?6:0)+(fx.disease>0?fx.sev:0);
  if(fx.heat>0&&fx.vit) stress*=.6;
  if(S.suppOn) stress*=.8;
  S.health=clamp(S.health+(stress<10?5:-(stress-10)*.6),0,100);
  if(growing){
    S.bodyCond=clamp(S.bodyCond+(c.feed===1?-6:c.feed===3?2.5:3)-(stress>15?3:0)+ff.b,0,100);
    S.health=clamp(S.health+ff.h,0,100);
    if(w>=8&&c.light>recL+2){S.early++;if(S.early===1||S.early%3===0)addLog('육성기에 빛이 너무 길어요. 너무 일찍 성성숙하면 알이 작고 산란 지속성이 떨어져요.')}
  }
  const intake=(growing?10+w*4.2:112)*[.86,1,1.12][c.feed-1];
  const feedKg=S.alive*intake*7/1000;
  const price=(fx.lock>0?S.basePrice:S.feedPrice)*ff.price;
  const lightCost=c.light*7*100, calCost=c.calcium?14000:0, ventCost=fx.heat>0?0:Math.max(0,c.temp-outsideL)*2800;   // 산란계 난방비(설정 온도가 바깥보다 높을수록)
  S.tot.feedKg+=feedKg;S.tot.feedCost+=feedKg*price;S.tot.other+=lightCost+calCost+ventCost;
  S.money-=feedKg*price+lightCost+calCost+ventCost;
  let rate=0;
  if(!growing){
    const pot=interp(LAY,w);
    const lightF=c.light<recL-1?.84:c.light>17?.96:1;
    const feedF=[.85,1,1][c.feed-1];
    const bodyF=Math.min(1,.75+.25*S.bodyCond/80)*(S.bodyCond>96?.97:1);
    const earlyF=1-Math.min(.12,S.early*.015);
    const hF=.55+.45*S.health/100;
    rate=clamp(ff.g*pot*lightF*feedF*bodyF*earlyF*hF*(fx.layDrop>0?1-fx.dropAmt:1)*(c.water===1?.85:1),0,.97);
    const eggs=S.alive*rate*7;
    const brokenR=.015+(c.calcium?.003:.03)*(w>24?1:.5)+Math.max(0,w-30)*(c.calcium?.001:.003)+(fx.heat>0?.02:0)+(fx.broken>0?fx.brokenAmt:0)+ff.br;
    const good=eggs*(1-brokenR);
    const ep=S.eggPrice*(fx.eggLow>0?fx.eggMul:1);
    const rev=good*ep;
    S.tot.eggs+=eggs;S.tot.good+=good;S.tot.revenue+=rev;S.tot.rateSum+=rate;S.tot.layWeeks++;
    S.money+=rev;S.brokenR=brokenR;
    if(w===18) addLog('첫 알을 낳았어요! 점등 시간을 1주에 1시간씩 늘려 16시간까지.');
    if(c.light<recL-1) addLog(`빛이 부족해요 (${c.light}시간). 산란 자극이 약해요.`);
  }
  S.rate=rate;
  const mort=.001+(100-S.health)*.0004+(fx.disease>0?fx.sev*.0008:0)+(heatStress>12?.004:0)+(tdevL>6?.002:0);
  const dead=Math.min(S.alive,Math.floor(S.alive*mort+rnd()));
  S.alive-=dead;S.tot.deaths+=dead;
  S.day=w;
  S.hist.push({x:w,a:rate,s:interp(LAY,w),b:S.bodyCond});
  if(dead>=8) addLog(`이번 주 폐사 ${dead}수.`);
  decayGauges();tick();
  if(w>=MODES.layer.maxDay){S.done=true;addLog('40주령 도달! 성적표를 확인해요.')}
}
function tick(){for(const k of ['heat','lock','disease','layDrop','broken','eggLow']) if(S.fx[k]>0){S.fx[k]--; if(S.fx[k]===0) endFx(k)}}
function endFx(k){
  const msg={heat:'폭염이 지나갔어요.',lock:'선구매한 사료를 다 썼어요. 이제 인상된 가격이에요.',disease:'질병 상황이 끝났어요.',layDrop:'산란율이 회복되고 있어요.',broken:'파란율이 안정됐어요.',eggLow:'계란값이 원래대로 돌아왔어요.'}[k];
  if(k==='heat'){S.fx.cool=false;S.fx.vit=false}
  addLog(msg);
}

    const box=$('#admVxPick');

      if(!programs.length){box.textContent='이 축종에 등록된 백신 카드가 없어요. (백신관리 메뉴에서 먼저 만들어 주세요)';return}

        <button class="btn" type="button" id="admVxImport">선택한 카드 가져오기</button> <span id="admVxMsg"></span>`;
      $('#admVxImport').addEventListener('click',()=>{
        const picked=[...box.querySelectorAll('[data-vxprog]:checked')].map(c=>programs.find(pg=>pg.key===c.dataset.vxprog)).filter(Boolean);
        if(!picked.length){$('#admVxMsg').textContent='가져올 카드를 선택해 주세요.';return}
        const have=new Set([...document.querySelectorAll('#admVx [data-vx="k"]')].map(i=>i.value));
        let added=0,skipped=0;
        picked.forEach(pg=>(pg.schedule||[]).forEach((r,i)=>{
          const k=pg.key+':'+i,days=CLOUD.ageDays(r.age);
          if(days==null||!r.vaccine){skipped++;return}
          if(have.has(k))return;
          const day=m==='layer'?(days<=0?1:Math.ceil(days/7)):(days<=0?1:Math.round(days));
          vxAdd({k,on:true,day:Math.min(max,Math.max(1,day)),age:String(r.age||''),name:String(r.vaccine||''),method:String(r.method||''),note:String(r.note||''),src:pg.title});
          added++;
        }));
        $('#admVxMsg').textContent=`${added}행 가져왔어요${skipped?` (일령을 알 수 없는 ${skipped}행은 건너뜀)`:''}. 아래에서 고친 뒤 저장·발행하세요.`;
      });

  $('#admAdd').addEventListener('click',()=>{
    const last=[...$('#admSt').querySelectorAll('.stg')].pop(),lt=last?+last.querySelector('[data-sto]').value:0,f=Math.min(max,lt+1);
    const d=document.createElement('div');d.className='stg';

  $('#admSt').addEventListener('click',e=>{const b=e.target.closest('[data-sdel]');if(b)b.closest('.stg').remove()});
  const collect=()=>{
    const diseases={};
    for(let i=0;i<DZ_BUILTIN[m].length;i++){
      const z=DZ_BUILTIN[m][i],on=$(`[data-dz="${i}"]`).checked,f=+$(`[data-from="${i}"]`).value,t=+$(`[data-to="${i}"]`).value;
      if(!(f>=1&&t<=max&&f<=t))throw new Error(`${z.name}: 구간은 1~${max} 사이에서 시작 ≤ 끝이어야 해요.`);
      diseases[z.name]={on,from:f,to:t};
    }
    const stages=[...document.querySelectorAll('#admSt .stg')].map(d=>({from:+d.querySelector('[data-sf]').value,to:+d.querySelector('[data-sto]').value,name:d.querySelector('[data-sn]').value.trim(),pts:d.querySelector('[data-sp]').value.split('\n').map(t=>t.trim()).filter(Boolean).slice(0,6)}));
    if(!stages.length)throw new Error('사양관리 구간이 하나 이상 있어야 해요.');
    stages.forEach(g=>{if(!(g.from>=1&&g.to<=max&&g.from<=g.to))throw new Error(`구간 ${g.name||g.from}: 1~${max} 사이에서 시작 ≤ 끝이어야 해요.`);if(!g.name)throw new Error('구간 이름을 적어 주세요.')});
    stages.sort((a,b)=>a.from-b.from);
    const custom=[...document.querySelectorAll('#admCz .cz')].map(c=>{
      const g=k=>c.querySelector(`[data-cz="${k}"]`).value.trim();
      const o={icon:g('icon')||'🤒',name:g('name'),signs:g('signs'),cause:g('cause'),symptom:g('symptom'),prevent:g('prevent'),q:g('q'),right:g('right'),wrong:[g('w1'),g('w2')].filter(Boolean),why:g('why'),
        from:+g('from'),to:+g('to'),on:c.querySelector('[data-cz="on"]').checked};
      const fail=t=>{const er=new Error(t);er.el=c;throw er};
      if(!o.name)fail('추가한 질병의 이름을 적어 주세요.');
      if(!o.signs)fail(`${o.name}: 현장에서 보이는 증상(진단 상황)을 적어 주세요.`);
      if(!o.q||!o.right||!o.wrong.length)fail(`${o.name}: 퀴즈 문제·정답·오답을 적어 주세요(오답은 1개 이상).`);
      if(!(o.from>=1&&o.to<=max&&o.from<=o.to))fail(`${o.name}: 구간은 1~${max} 사이에서 시작 ≤ 끝이어야 해요.`);
      if(DZ_BUILTIN[m].some(z=>z.name===o.name))fail(`${o.name}: 이미 있는 질병 이름이에요.`);
      return o;
    });
    if(new Set(custom.map(x=>x.name)).size!==custom.length)throw new Error('추가한 질병 이름이 겹쳐요.');
    const costs={};
    for(const k of ['water','vent','litter','supp','rat','cure']){const v=+$(`[data-cost="${k}"]`).value;if(!(v>=0&&v<=1000000))throw new Error('버튼 비용은 0~1,000,000원 사이로 적어 주세요.');costs[k]=Math.round(v)}
    const feedPrices={};
    for(const f of FEEDS[m]){const v=+$(`[data-fp="${f.id}"]`).value;if(!(v>=0&&v<=1000000))throw new Error('사료 가격은 0~1,000,000원 사이로 적어 주세요.');feedPrices[f.id]=Math.round(v)}
    const vaccines=[...document.querySelectorAll('#admVx .vxr')].map(r=>{
      const g=k=>r.querySelector(`[data-vx="${k}"]`).value.trim();
      const o={k:g('k')||('m'+Math.random().toString(36).slice(2,8)),on:r.querySelector('[data-vx="on"]').checked,day:+g('day'),name:g('name'),age:g('age'),method:g('method'),note:g('note'),src:g('src')};
      if(!o.name)throw new Error('백신 행의 이름을 적어 주세요.');
      if(!(o.day>=1&&o.day<=max))throw new Error(`${o.name}: ${u}는 1~${max} 사이로 적어 주세요.`);
      return o;
    });
    const vaccineCost=+$('[data-vxcost]').value;
    if(!(vaccineCost>=0&&vaccineCost<=10000000))throw new Error('접종비는 0~10,000,000원 사이로 적어 주세요.');
    const cureBonus=+$('[data-bonus]').value;
    if(!(cureBonus>=0&&cureBonus<=10000000))throw new Error('치료 보너스는 0~10,000,000원 사이로 적어 주세요.');
    return {diseaseWeight:+$('#admW').value,diseases,stages,custom,costs,feedPrices,cureBonus:Math.round(cureBonus),vaccines,vaccineCost:Math.round(vaccineCost)};
  };
  const publish=async(section,okMsg)=>{
    gmsg('저장 중…',true);
    try{
      const next=Object.assign({},CFG||{},{v:1});
      if(section)next[m]=section;else delete next[m];
      await CLOUD.saveConfig(next);
      CFG=next;applyCfg(CFG);render();

      if(!section){setTimeout(()=>{closeModal();openAdmin()},700)}
    }catch(e){gmsg(e.message||'저장하지 못했어요.')}
  };
  $('#admSave').addEventListener('click',()=>{let sec;document.querySelectorAll('#admCz .cz.bad').forEach(x=>x.classList.remove('bad'));try{sec=collect()}catch(e){gmsg(e.message);if(e.el){e.el.classList.add('bad');e.el.scrollIntoView({block:'center',behavior:'smooth'})}return}publish(sec,'저장했어요. 회원들이 다음에 창을 열 때부터 적용돼요.')});
  $('#admReset').addEventListener('click',()=>{const b=$('#admReset');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 기본값으로';return}publish(null,'기본값으로 되돌렸어요.')});
}

function maybeEvent(){
  if(S.done) return null;
  const p=S.mode==='broiler'?.16:.24;
  if(rnd()>p) return null;
  const pool=[];
  const vp=vaxProtection();
  EVENTS.filter(e=>e.modes.includes(S.mode)&&e.when(S)&&!(S.fx[e.id]>0)).forEach(e=>{
    let n=e.id==='disease'?DZ_WEIGHT[S.mode]:1;
    if(e.id==='disease'&&n>0){if(rnd()<vp.prot)n=0;else if(vp.missed>0)n+=1}     // 백신: 제때 맞춘 만큼 질병 감소 / 놓치면 증가
    for(let i=0;i<n;i++)pool.push(e)});
  return pool.length?pool[Math.floor(rnd()*pool.length)]:null;
}

}

function henSVG(mode){

  return `<div class="flip"><div class="bo"><img class="sc" alt="" draggable="false" src="${SPR.chick}"><img class="sa" alt="" draggable="false" src="${SPR[m]}"><img class="ssc" alt="" draggable="false" src="${SPR.sickchick}"><img class="ssa" alt="" draggable="false" src="${SPR['sick'+m]}"></div></div><span class="bubble"></span>`;

$('#feederImg').src=SPR.feed;$('#ratImg').src=SPR.rat;$('#baitImg').src=SPR.bait;$('#watererImg').src=SPR.water;
let sprites=[];
function buildFlock(n){
  flockEl.innerHTML='';sprites=[];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='hen';el.innerHTML=henSVG();flockEl.appendChild(el);
    sprites.push({el,ox:(rnd()-.5)*.16,oy:(rnd()-.5)*.09,fol:false,x:.1+rnd()*.8,y:.52+rnd()*.18,tx:0,ty:0,mode:'idle',timer:rnd()*80,dir:rnd()<.5?1:-1,bubbleT:0});
  }
}
function visibleCount(){return Math.max(1,Math.round(7*S.alive/S.birds0))}
/* ── 쥐 ──
   하루/한 주를 보낼 때 가끔 나타나(S.rat), 병아리들을 놀라게 하고 사료를 축낸다. 쥐약 버튼(₩5,000)으로 퇴치. */
/* ── 백신 프로그램 ──
   관리자가 가져온 일정(VAX)의 일령/주령이 되면 「💉 백신」 버튼이 노랗게 깜박이고, 눌러서 접종(비용)한다.
   제때 맞출수록 질병 발생 확률이 줄고, 안 맞추면 오히려 늘어난다. */
const vaxList=()=>VAX[S.mode]||[];
function vaxPending(){if(!S)return[];S.vaxDone=S.vaxDone||{};return vaxList().filter(x=>x.day<=S.day&&!S.vaxDone[x.k])}
function vaxNext(){if(!S)return null;S.vaxDone=S.vaxDone||{};return vaxList().find(x=>x.day>S.day&&!S.vaxDone[x.k])||null}
function vaxProtection(){      // 0 ~ .5 : 이미 지난 일정 중 제때(2차례 안) 맞춘 비율
  const due=vaxList().filter(x=>x.day<=S.day);if(!due.length)return{prot:0,missed:0};
  let credit=0,missed=0;
  due.forEach(x=>{const d=S.vaxDone&&S.vaxDone[x.k];if(d)credit+=(d.at<=x.day+2)?1:.5;else if(S.day>x.day+2)missed++});
  return{prot:.5*credit/due.length,missed};
}
function vaxCheck(){           // 하루/한 주를 보낸 뒤: 새로 도래한 접종 알림
  const u=S.mode==='layer'?'주령':'일령';
  S.vaxSeen=S.vaxSeen||{};
  const fresh=vaxPending().filter(x=>!S.vaxSeen[x.k]);
  if(!fresh.length)return;
  fresh.forEach(x=>{S.vaxSeen[x.k]=true;addLog(`💉 ${x.day}${u} 접종일: ${x.name}${x.method?' ('+x.method+')':''}`)});
  toast('💉 백신 접종일이에요! 오른쪽 「백신」 버튼을 눌러요');
}
function showVaccine(){
  const items=vaxPending(),cost=VAX_COST[S.mode],u=S.mode==='layer'?'주령':'일령';
  if(!items.length){toast('지금 맞출 백신이 없어요');return}
  openModal(`<div class="ev-icon">💉</div><h2>백신 접종</h2><p class="note">정해진 ${u}에 맞출수록 병에 덜 걸려요. 1회 접종비 ${won(cost)}이에요. 실제 백신 사용·용법은 제품 설명서와 수의사 지시를 따르세요.</p>
   <div style="display:flex;flex-direction:column;gap:8px">${items.map(x=>`<div class="result" style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
     <div style="min-width:0"><b>${x.day}${u} · ${escH(x.name)}</b><br><small>${escH([x.method,x.note,x.src].filter(Boolean).join(' · '))}</small>${x.day<S.day?`<br><small style="color:var(--bad)">${S.day-x.day}${S.mode==='layer'?'주':'일'} 늦었어요</small>`:''}</div>
     <button class="btn primary" type="button" data-vx="${escH(x.k)}">접종하기 ${won(cost)}</button></div>`).join('')}</div>
   <button class="btn" type="button" id="vxClose">닫기</button>`);
  $('#vxClose').addEventListener('click',closeModal);
  $('#sheet').querySelectorAll('[data-vx]').forEach(b=>b.addEventListener('click',()=>{
    const it=items.find(x=>x.k===b.dataset.vx);if(!it||(S.vaxDone&&S.vaxDone[it.k]))return;
    S.vaxDone=S.vaxDone||{};S.vaxDone[it.k]={at:S.day};
    S.money-=cost;S.tot.other+=cost;S.health=clamp(S.health-1,0,100);
    addLog(`💉 ${it.name} 접종 (${won(cost)})`);burst('💉',3);toast('접종했어요! 면역이 올라가요');
    render();autosave();
    if(vaxPending().length)showVaccine();else closeModal();
  }));
}
/* ── 아픈 닭 ──
   가끔(건강이 나쁠수록 자주) 몇 마리가 아프다(S.sick). 치료 버튼(₩10,000)으로 낫게 하고, 두면 건강이 깎이고 폐사·전염이 늘어난다. */
function sickStep(){
  if(!S||S.done)return;
  if(S.sick){
    S.sick.steps=(S.sick.steps||0)+1;
    S.health=clamp(S.health-(2+S.sick.steps),0,100);
    const dead=Math.min(S.alive-1,Math.ceil(S.alive*.003*S.sick.n));
    if(dead>0){S.alive-=dead;S.tot.deaths+=dead}
    if(S.sick.steps>=3&&S.sick.n<3){S.sick.n++;addLog('🤒 아픈 닭이 늘었어요! 치료해 주세요.')}
    else addLog('🤒 아픈 닭을 그냥 두면 다른 닭에게 옮고 폐사가 늘어요. 치료해 주세요.');
  } else if((S.mode==='broiler'?S.day>=4:S.day>=3)&&rnd()<(.09+(S.health<60?.12:0))){
    S.sick={n:1+(rnd()<.3?1:0),steps:0};
    addLog('🤒 아픈 닭이 보여요! 오른쪽 「치료」 버튼으로 치료해 주세요.');
    toast('🤒 아픈 닭이 나왔어요! 치료 ₩10,000');
  }
}
let ratGhost=null;      // 퇴치되는 쥐의 마지막 모습(잠깐 보여 주기)
function ratStep(){
  if(!S||S.done)return;
  if(S.rat){
    S.rat.steps=(S.rat.steps||0)+1;
    S.health=clamp(S.health-(3+S.rat.steps*1.5),0,100);
    S.feedLv=Math.max(0,S.feedLv-12);
    addLog('🐭 쥐가 사료를 축내고 닭들이 겁먹었어요! 쥐약을 놓아 주세요.');
  } else if((S.mode==='broiler'?S.day>=3:S.day>=2)&&rnd()<.14){
    S.rat={x:.36,dir:-1,steps:0};
    addLog('🐭 쥐가 나타났어요! 병아리들이 놀랐어요. 쥐약을 놓아 주세요.');
    toast('🐭 쥐가 나타났어요! 쥐약 놓기로 퇴치해요');
  }
}
function killRat(){
  ratGhost={x:S.rat.x,dir:S.rat.dir,t:performance.now()};

function mood(){
  if(S.rat)return 'scared';
  const target=S.mode==='broiler'?recTemp(Math.max(1,S.day)):envRec('layer',Math.max(1,S.day)).t;
  if(S.eff-target>3)return 'hot';
  if(target-S.eff>3)return 'cold';
  if(S.health<55||S.fx.disease>0)return 'sick';
  if(S.ammonia>25)return 'smelly';
  return 'happy';
}
const BUB={scared:['꺅!','😱','쥐다!','무서워'],hot:['헥헥…','💦','더워요!'],cold:['추워요','❄️','오들오들'],sick:['콜록','🤒','힘없어요'],smelly:['콜록','눈 따가워','😣'],happy:['삐약!','♥','꼬꼬','냠냠']};
let rafLast=0;
function loop(ts){
  const dt=Math.min(50,ts-(rafLast||ts));rafLast=ts;
  if(S&&!$('#gameView').hidden) animFlock(dt);
  requestAnimationFrame(loop);
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animFlock(dt){
  const W=scene.clientWidth,t=growthT();
  const size=W*(.105+.07*t);
  const m=mood();
  const speed=(reduce?.00002:.00009)*(S.health<50?.5:1)*(m==='hot'?.5:1)*(S.rat?2.4:1);
  // 병아리끼리 겹치지 않게 서로 밀어낸다(같은 곳으로 모이거나 도망칠 때도 간격 유지)
  {
    const Hh=scene.clientHeight,minD=size*.92;
    for(let pass=0;pass<2;pass++)for(let i=0;i<sprites.length;i++)for(let j=i+1;j<sprites.length;j++){
      const a=sprites[i],b=sprites[j];
      let dx=(a.x-b.x)*W,dy=(a.y-b.y)*Hh*1.6;       // 세로는 원근 때문에 더 민감하게
      let d=Math.hypot(dx,dy);
      if(d<minD){
        if(d<.5){dx=rnd()-.5;dy=rnd()-.5;d=Math.hypot(dx,dy)||1}
        const push=(minD-d)*.8,nx=dx/d,ny=dy/d;
        a.x+=nx*push/W;b.x-=nx*push/W;
        a.y+=ny*push/(Hh*1.6);b.y-=ny*push/(Hh*1.6);
      }
    }
    for(const q of sprites){q.x=clamp(q.x,.04,.86);q.y=clamp(q.y,.48,.78)}
  }
  // 쥐 움직임(바닥을 좌우로 오감)과 퇴치 연출
  const ratEl=$('#ratImg'),baitEl=$('#baitImg');
  if(S.rat){
    S.rat.x+=S.rat.dir*.00013*dt;
    if(S.rat.x<.05){S.rat.x=.05;S.rat.dir=1}
    if(S.rat.x>.38){S.rat.x=.38;S.rat.dir=-1}
    ratEl.hidden=false;ratEl.classList.remove('dying');ratEl.style.left=(S.rat.x*100)+'%';ratEl.style.transform=S.rat.dir<0?'scaleX(-1)':'none';
    baitEl.hidden=true;
  } else if(ratGhost){
    const age=performance.now()-ratGhost.t;
    if(age<1500){
      ratEl.hidden=false;ratEl.style.left=(ratGhost.x*100)+'%';ratEl.style.transform=ratGhost.dir<0?'scaleX(-1)':'none';
      baitEl.hidden=false;baitEl.style.left=(Math.max(2,ratGhost.x-10))+'%';
      if(age>350)ratEl.classList.add('dying');
    } else {ratGhost=null;ratEl.hidden=true;ratEl.classList.remove('dying');baitEl.hidden=true}
  } else {ratEl.hidden=true;baitEl.hidden=true}
  for(const s of sprites){
    if(S.rat&&Math.abs(s.x-S.rat.x)<.3){           // 쥐가 가까우면 반대쪽으로 도망
      s.tx=clamp(s.x+(s.x>=S.rat.x?.32:-.32),.05,.5);s.ty=.5+rnd()*.2;s.mode='walk';s.timer=999;
      if(rnd()<.03)showBubble(s,BUB.scared[Math.floor(rnd()*BUB.scared.length)]);
    }
    s.timer-=dt/16;
    if(s.timer<=0){
      const r=rnd();
      if(m==='cold'&&r<.7){s.mode='walk';s.tx=.42+rnd()*.16;s.ty=.6+rnd()*.12}
      else if(r<.45){s.mode='walk';s.tx=.06+rnd()*.7;s.ty=.5+rnd()*.2}
      else if(r<.75){s.mode='peck';s.timer=60}
      else{s.mode='idle';s.timer=40+rnd()*90}
      if(s.mode==='walk') s.timer=999;
      if(S.sick&&sprites.indexOf(s)<S.sick.n){showBubble(s,['콜록…','🤒','기운이 없어요','치료해 주세요'][Math.floor(rnd()*4)]);s.mode='idle';s.timer=80}
      else if(rnd()<.18){const nm=needMsgs(),arr=(m!=='scared'&&nm.length&&rnd()<.75)?nm:BUB[m];showBubble(s,arr[Math.floor(rnd()*arr.length)])}
    }
    if(s.mode==='walk'){
      const dx=s.tx-s.x,dy=s.ty-s.y,dist=Math.hypot(dx,dy);
      if(dist<.01){s.mode='idle';s.timer=20+rnd()*60}
      else{const st=Math.min(dist,speed*dt);s.x+=dx/dist*st;s.y+=dy/dist*st;if(Math.abs(dx)>.004)s.dir=dx>0?1:-1}
    }
    const el=s.el;
    el.style.width=size+'px';
    el.style.left=(s.x*W-size/2)+'px';
    el.style.top=(s.y*scene.clientHeight-size*.85)+'px';
    el.style.zIndex=Math.round(s.y*100);
    el.classList.toggle('walk',s.mode==='walk');
    el.classList.toggle('peck',s.mode==='peck');
    el.classList.toggle('left',s.dir<0);
    el.classList.toggle('pant',m==='hot');
    const idx=sprites.indexOf(s),isSick=!!(S.sick&&idx>=0&&idx<S.sick.n);
    el.classList.toggle('sick',isSick);
    if(isSick&&s.mode==='walk'){s.mode='idle';s.timer=60}
    if(s.bubbleT>0){s.bubbleT-=dt;if(s.bubbleT<=0)el.querySelector('.bubble').classList.remove('show')}
  }
}
// 닭이 하는 말: 사료·물·환기·점등이 모자라거나 맞지 않으면 그 이야기를 먼저 한다
function needMsgs(){
  const m=[];
  if(!S)return m;
  if(S.feedLv<FEED_DROP)m.push('배고파요! 🌾','사료가 없어요…','꼬르륵');
  if(S.waterLv<WATER_DROP)m.push('목말라요! 💧','물 주세요~','물이 없어요');
  if(S.ventLv<34)m.push('답답해요 🌀','공기가 탁해요','환기해 주세요');
  if(S.mode==='layer'){const rec=recLight(Math.max(1,S.day+1));
    if(S.ctrl.light<rec-1)m.push('너무 어두워요 💡','불을 켜 주세요');
    else if(S.ctrl.light>rec+1)m.push('눈부셔서 잠이 안 와요','불이 너무 길어요');}
  if(S.litter<35)m.push('깔짚이 눅눅해요');
  return m;
}
function showBubble(s,txt){const b=s.el.querySelector('.bubble');b.textContent=txt;b.classList.add('show');s.bubbleT=1600}

function wxClass(code){
  if(code==null)return 'wx-clear';
  if(code===0)return 'wx-clear';
  if(code<=2)return 'wx-pcloud';
  if(code===3)return 'wx-cloudy';
  if(code===45||code===48)return 'wx-fog';
  if((code>=51&&code<=67)||(code>=80&&code<=82))return 'wx-rain';
  if((code>=71&&code<=77)||code===85||code===86)return 'wx-snow';
  if(code>=95)return 'wx-storm';
  return 'wx-clear';
}

function doAct(k){

  const cost=btnCost(k);
  if(k==='vax'){showVaccine();return}
  if(k==='cure'){if(!S.sick){toast('지금은 아픈 닭이 없어요');return}S.money-=cost;S.tot.other+=cost;S.sick=null;S.health=clamp(S.health+4,0,100);burst('💊',3);toast('치료했어요! 닭들이 기운을 차려요 🐥');addLog(`🩺 아픈 닭을 치료했어요 (${won(cost)})`);render();autosave();return}

  if(k==='supp'){if(S.suppOn){toast('이번 차례에는 이미 영양제를 줬어요');return}S.suppOn=true;S.health=clamp(S.health+5,0,100);S.money-=cost;S.tot.other+=cost;burst('💊',3);toast('영양제를 줬어요 · 스트레스를 덜 받아요');render();autosave();return}
  if(k==='litter'){if(S.litter>=98){toast('깔짚이 이미 보송해요');return}S.litter=clamp(S.litter+35,0,100);S.ammonia=clamp(S.ammonia-10,0,60);burst('✨',3);toast('새 깔짚을 깔았어요')}

  else{if(S.ventLv>=98){toast('환기가 충분해요');return}S.ventLv=clamp(S.ventLv+50,0,100);burst('🌀',3);toast('환기팬을 가동했어요')}
  S.money-=cost;S.tot.other+=cost;
  render();autosave();
}

/* 오늘의 날씨 — 현재 위치(허용 시) → 사이트에서 저장한 날씨 지역 → 서울 순서로 Open-Meteo에서 읽어 온다. 표시만 하고 게임 수치에는 넣지 않는다. */
const WX={status:'idle'};
const WXC={0:['☀️','맑음'],1:['🌤️','대체로 맑음'],2:['⛅','구름 조금'],3:['☁️','흐림'],45:['🌫️','안개'],48:['🌫️','안개'],51:['🌦️','이슬비'],53:['🌦️','이슬비'],55:['🌧️','이슬비'],61:['🌧️','비'],63:['🌧️','비'],65:['🌧️','강한 비'],71:['🌨️','눈'],73:['🌨️','눈'],75:['❄️','많은 눈'],80:['🌦️','소나기'],81:['🌧️','소나기'],82:['⛈️','강한 소나기'],95:['⛈️','뇌우'],96:['⛈️','뇌우'],99:['⛈️','뇌우']};
function wxFetch(lat,lng,name,approx){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FSeoul&forecast_days=1`;
  return fetch(url).then(r=>r.json()).then(j=>{
    const c=j.current,d=j.daily;
    if(!c||!d)throw new Error('no data');
    Object.assign(WX,{status:'ok',name,approx,t:c.temperature_2m,rh:c.relative_humidity_2m,code:c.weather_code,max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],rain:d.precipitation_sum[0]});
  });
}
function ensureWx(){
  if(WX.status!=='idle')return;
  WX.status='loading';
  const done=()=>{if(S&&!$('#gameView').hidden){renderGuide();renderWindowWx()}};
  const fallback=()=>{
    let loc=null;try{loc=JSON.parse(localStorage.getItem('weather_loc')||'null')}catch(e){}
    const use=loc&&isFinite(loc.lat)&&isFinite(loc.lng)?{lat:loc.lat,lng:loc.lng,name:loc.name||'저장된 지역',approx:false}:{lat:37.57,lng:126.98,name:'서울(기본)',approx:true};
    wxFetch(use.lat,use.lng,use.name,use.approx).catch(()=>{WX.status='error'}).then(done);
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{wxFetch(p.coords.latitude,p.coords.longitude,'현재 위치',false).catch(()=>{WX.status='error'}).then(done)},()=>fallback(),{timeout:7000,maximumAge:900000});
  } else fallback();
}
function wxTip(){
  if(WX.status!=='ok')return '';
  const t=[];
  if(WX.max>=30)t.push('더운 날이에요 — 환기·급수를 넉넉히');
  if(WX.min<=0)t.push('영하로 떨어져요 — 보온과 외풍 차단, 급수 라인 동파 점검');
  else if(WX.min<=5)t.push('쌀쌀해요 — 새벽 보온 확인');
  if(WX.rain>=10)t.push('비가 많아 습해요 — 깔짚·환기 점검');
  if(WX.max-WX.min>=10)t.push('일교차가 커요 — 호흡기 관리');
  return t.join(' · ');
}

   ${wx}

   <details class="gpts"><summary>✅ ${S.done?'':d+u+' '+g.name+' · '}${g.pts.join(' · ')}</summary><ul class="pts">${g.pts.map(t=>`<li>${t}</li>`).join('')}</ul></details>

   <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">교육용 참고값이에요. 실제 농장은 품종 관리지침과 사료회사·수의사 기준을 따르세요.${lay?` 점등은 ${d>=18?'주 1시간씩 늘려 16시간까지':d>=7?'육성기에는 10시간 유지':'점점 줄여 10시간까지'}.`:''}</p></details>`;
}

function renderChart(){
  const H=S.hist,lay=S.mode==='layer';
  const W=320,Ht=150,p={l:36,r:10,t:10,b:22};
  const maxX=lay?40:33,maxY=lay?1:2400;
  const X=x=>p.l+(x/maxX)*(W-p.l-p.r),Y=y=>Ht-p.b-(y/maxY)*(Ht-p.t-p.b);
  const std=[];for(let x=lay?17:0;x<=maxX;x++)std.push([X(x),Y(lay?interp(LAY,x):stdW(x))]);
  const act=(lay?H.filter(h=>h.x>=18):[{x:0,a:42},...H]).map(h=>[X(h.x),Y(h.a)]);
  const path=a=>a.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const ticksY=lay?[0,.25,.5,.75,1]:[0,600,1200,1800,2400];
  const ticksX=lay?[0,10,18,30,40]:[0,7,14,21,28,33];
  let s=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${lay?'산란율':'체중'} 변화">`;
  s+=ticksY.map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2E6F0"/><text x="${p.l-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#7D7A99">${lay?(v*100)+'%':(v/1000).toFixed(1)+'kg'}</text>`).join('');
  s+=ticksX.map(v=>`<text x="${X(v)}" y="${Ht-6}" font-size="10" text-anchor="middle" fill="#7D7A99">${v}${lay?'주':'일'}</text>`).join('');
  s+=`<path d="${path(std)}" fill="none" stroke="#B9B6D3" stroke-width="2" stroke-dasharray="5 4"/>`;
  if(act.length>1){s+=`<path d="${path(act)}L${act[act.length-1][0]} ${Y(0)}L${act[0][0]} ${Y(0)}Z" fill="#FF7F6E22"/><path d="${path(act)}" fill="none" stroke="#FF7F6E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    const e=act[act.length-1];s+=`<circle cx="${e[0]}" cy="${e[1]}" r="4.5" fill="#FF7F6E" stroke="#3A3658" stroke-width="2"/>`}
  else if(lay) s+=`<text x="${(W+p.l)/2}" y="${Ht/2}" font-size="12" text-anchor="middle" fill="#7D7A99">18주령부터 산란이 시작돼요</text>`;
  s+='</svg>';

  $('#chartCap').innerHTML=`<span><i style="background:#FF7F6E"></i>우리 농장</span><span><i style="background:#B9B6D3"></i>표준</span>`;
}

/* ── 화면 전환 ── */
function start(mode){newGame(mode);sprites=[];$('#startView').hidden=true;$('#gameView').hidden=false;render();autosave();window.scrollTo({top:0,behavior:'smooth'})}
const HOME_SUB=LOCK?MODES[LOCK].name+' · 우리 농장 경영기':'병아리부터 닭까지, 우리 농장 경영기';
function goHome(){$('#startView').hidden=false;$('#gameView').hidden=true;$('#subtitle').textContent=HOME_SUB;renderRecords();fetchCloudHint()}
if(LOCK){
  $(LOCK==='broiler'?'#pickLayer':'#pickBroiler').hidden=true;
  $('.picks').classList.add('one');$('#subtitle').textContent=HOME_SUB;
}
function getSaved(){
  let sv=LS.get(lsKey('kkokko-autosave'),null);
  if(!sv&&LOCK){const old=LS.get(lsKeyN('kkokko-autosave'),null);if(old&&old.mode===LOCK)sv=old}
  return sv;
}
function resumeLocal(sv){S=sv;sprites=[];$('#startView').hidden=true;$('#gameView').hidden=false;render()}
// 시작 버튼을 눌렀을 때 이 닉네임으로 저장된 농장이 있으면(이 기기 또는 내 계정) 덮어쓰기 전에 꼭 물어본다.
function startGuarded(mode){
  needNick(async()=>{
    if(CLOUD&&CHP&&CH.state==='loading')toast('저장된 농장을 확인하는 중…');
    if(CLOUD&&CHP)await Promise.race([CHP.catch(()=>{}),new Promise(r=>setTimeout(r,5000))]);
    const sv=getSaved(),hit=CH.hit,unit=mode==='layer'?'주':'일';
    const localOk=!!(sv&&!sv.done&&sv.mode===mode);
    const cloudOk=!!(hit&&!hit.done&&hit.mode===mode&&(!localOk||(hit.day||0)>(sv.day||0)));
    if(!localOk&&!cloudOk){
      if(CLOUD&&CH.state==='err'){
        openModal(`<div class="ev-icon">⚠️</div><h2>저장 확인을 못 했어요</h2><p>내 계정에 저장된 농장이 있는지 읽지 못했어요. 지금 새로 시작하면 저장돼 있던 농장을 덮어쓸 수 있어요.</p>
         <div class="row"><button class="btn" type="button" id="gkRetry">다시 확인</button><button class="btn" type="button" id="gkForce">그래도 새로 시작</button><button class="btn" type="button" id="gClose">취소</button></div>`);
        $('#gClose').addEventListener('click',closeModal);
        $('#gkRetry').addEventListener('click',()=>{closeModal();fetchCloudHint();toast('다시 확인하는 중…')});
        $('#gkForce').addEventListener('click',()=>{closeModal();start(mode)});
        return;
      }
      start(mode);return;
    }
    const day=cloudOk?hit.day:sv.day;
    openModal(`<div class="ev-icon">🏡</div><h2>저장된 농장이 있어요</h2>
     <div class="result">${MODES[mode].name} ${Math.max(1,day||0)}${unit}${cloudOk?' · ☁ 내 계정에 저장':''}</div>
     <p>새로 시작하면 저장된 농장이 사라져요. 이어서 하시겠어요?</p>
     <div class="row"><button class="btn primary" type="button" id="gkResume">이어하기</button><button class="btn" type="button" id="gkNew">새로 시작</button><button class="btn" type="button" id="gClose">취소</button></div>`);
    $('#gClose').addEventListener('click',closeModal);
    $('#gkResume').addEventListener('click',()=>{closeModal();if(cloudOk)cloudLoad(hit.nickname);else resumeLocal(sv)});
    $('#gkNew').addEventListener('click',()=>{
      const b=$('#gkNew');
      if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 새로 시작(덮어쓰기)';b.style.background='var(--bad)';b.style.color='#fff';return}
      if(sv)LS.set(lsKey('kkokko-prev'),sv);      // 이 기기에는 직전 농장을 하나 남겨 둬요(시작 화면의 「직전 농장 복구」)
      closeModal();start(mode);
    });
  });
}
$('#pickBroiler').addEventListener('click',()=>startGuarded('broiler'));
$('#pickLayer').addEventListener('click',()=>startGuarded('layer'));
$('#btnHome').addEventListener('click',goHome);
let CHP=null;
let CH={state:'idle',hit:null};     // 내 계정(Firebase)에 저장된 이 닉네임의 농장 — 시작 화면에 「불러오기」로 보여 준다
function fetchCloudHint(){
  if(!CLOUD||!NICK){CH={state:'idle',hit:null};CHP=null;return}
  CH={state:'loading',hit:null};renderRecords();
  const nick=NICK;
  CHP=CLOUD.list().then(list=>{if(nick!==NICK)return;CH={state:'ok',hit:list.filter(ownSlot).find(x=>baseName(x.nickname)===NICK)||null}})
    .catch(e=>{CH={state:'err',hit:null,msg:e.message||'저장 목록을 읽지 못했어요.'}})
    .then(()=>{if(!$('#startView').hidden)renderRecords()});
  return CHP;
}
function renderRecords(){
  const r=[];if(R.broiler.best!=null&&(!LOCK||LOCK==='broiler'))r.push(`육계 최고 ${won(R.broiler.best)}`);if(R.layer.best!=null&&(!LOCK||LOCK==='layer'))r.push(`산란계 최고 ${won(R.layer.best)}`);
  let saved=LS.get(lsKey('kkokko-autosave'),null);
  if(!saved&&LOCK){const old=LS.get(lsKeyN('kkokko-autosave'),null);if(old&&old.mode===LOCK)saved=old}
  $('#records').innerHTML=(r.length?r.join(' · '):'아직 기록이 없어요. 첫 농장을 시작해 볼까요?')+(saved&&!saved.done?` · <button class="btn" type="button" id="resume" style="padding:3px 10px;font-size:13px">이어하기 (${MODES[saved.mode].name} ${Math.max(1,saved.day)}${saved.mode==='layer'?'주':'일'})</button>`:'');
  const rb=$('#resume');if(rb)rb.addEventListener('click',()=>{S=saved;sprites=[];$('#startView').hidden=true;$('#gameView').hidden=false;render()});
  const prev=LS.get(lsKey('kkokko-prev'),null);
  if(prev&&!prev.done&&MODES[prev.mode]&&(!saved||saved.done||(prev.day||0)!==(saved.day||0)||prev.money!==saved.money)){
    $('#records').insertAdjacentHTML('beforeend',` · <button class="btn" type="button" id="prevRestore" style="padding:3px 10px;font-size:13px">↩ 직전 농장 복구 (${MODES[prev.mode].name} ${Math.max(1,prev.day||0)}${prev.mode==='layer'?'주':'일'})</button>`);
    $('#prevRestore').addEventListener('click',()=>{S=prev;sprites=[];$('#startView').hidden=true;$('#gameView').hidden=false;render();autosave();toast('직전 농장을 되살렸어요')});
  }
  if(CLOUD&&NICK){
    let ch='';
    const hit=CH.hit,unit=hit&&hit.mode==='layer'?'주':'일';
    if(CH.state==='loading')ch=' · <span style="font-size:13px;color:var(--muted)">☁ 저장된 농장 확인 중…</span>';
    else if(CH.state==='err')ch=` · <span style="font-size:13px;color:var(--bad)">☁ ${escH(CH.msg)}</span> <button class="btn" type="button" id="cloudRetry" style="padding:3px 10px;font-size:13px">다시 시도</button>`;
    else if(hit&&!hit.done&&MODES[hit.mode]&&(!saved||saved.done||(hit.day||0)>(saved.day||0)))ch=` · <button class="btn primary" type="button" id="cloudResume" style="padding:3px 10px;font-size:13px">☁ 저장된 농장 불러오기 (${MODES[hit.mode].name} ${Math.max(1,hit.day||0)}${unit})</button>`;
    if(ch){$('#records').insertAdjacentHTML('beforeend',ch);
      const a=$('#cloudResume');if(a)a.addEventListener('click',()=>cloudLoad(hit.nickname));
      const b=$('#cloudRetry');if(b)b.addEventListener('click',fetchCloudHint)}
  }
}
async function flush(){
  if(!S)return;
  LS.set(lsKey('kkokko-autosave'),S);
  clearTimeout(cloudTimer);
  if(!CLOUD||!NICK)return;
  for(let i=0;i<20&&cloudBusy;i++)await new Promise(r=>setTimeout(r,150));
  await cloudSave(true);
}
window.farmGameFlush=flush;
window.addEventListener('pagehide',()=>{if(S)LS.set(lsKey('kkokko-autosave'),S)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)flush()});
function autosave(){if(!S)return;LS.set(lsKey('kkokko-autosave'),S);scheduleCloudSave()}
function pickPreview(id,mode){
  const box=$(id);
  box.innerHTML=`<div class="hen" style="left:12%;bottom:6%;width:74px;--grow:1">${henSVG(mode)}</div><div class="hen left" style="right:30%;bottom:10%;width:40px;--grow:0">${henSVG(mode)}</div><div class="hen" style="right:8%;bottom:4%;width:36px;--grow:0">${henSVG(mode)}</div>${mode==='layer'?`<img class="egg" alt="" src="${SPR.egg}" style="position:absolute;left:44%;bottom:10%;width:20px;flex:none"><img class="egg" alt="" src="${SPR.egg}" style="position:absolute;left:51%;bottom:8%;width:20px;flex:none">`:''}`;
}
pickPreview('#picB','broiler',1);pickPreview('#picL','layer',1);

/* ── 닉네임 · Firebase 저장 ──
   유료서비스 화면(부모 창)이 window.farmGameCloud를 열어 준다(srcdoc이라 같은 출처).
   저장 위치: Firebase Storage premium_board/farmgame/{로그인 uid}/{닉네임 키}/save.json — 내 계정 안에서 닉네임별로 따로. */
const CLOUD=(()=>{try{return window.parent!==window&&window.parent.farmGameCloud||null}catch(e){return null}})();
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nickErr=n=>!n?'닉네임을 입력해 주세요.':n.length<2||n.length>12?'닉네임은 2~12자로 지어 주세요.':!/^[가-힣A-Za-z0-9_]+$/.test(n)?'한글·영문·숫자·밑줄(_)만 쓸 수 있어요.':'';
function renderNick(){
  const bn=$('#brandName');if(bn){bn.textContent=NICK||'꼬꼬 농장';bn.title=NICK||''}
  if(S&&$('#sign'))$('#sign').textContent=signText();
  $('#btnNick').textContent=NICK?'🐥 '+NICK:'🐥 닉네임';
  const nl=$('#nickline');
  if(nl)nl.innerHTML=NICK?`농장주 <b>${escH(NICK)}</b> <button class="btn" type="button" id="nlChange" style="padding:3px 10px;font-size:13px">닉네임 바꾸기</button>`:`<button class="btn primary" type="button" id="nlChange">🐥 닉네임 정하고 시작하기</button>`;
  const c=$('#nlChange');if(c)c.addEventListener('click',()=>openNick());
}
function needNick(go){if(NICK){go();return}openNick(go)}
function setNick(n){
  NICK=n;LS.set('kkokko-nick',n);R=loadR();
  if(S&&!$('#gameView').hidden){LS.set(lsKey('kkokko-autosave'),S)}
  renderNick();renderRecords();fetchCloudHint();
}
function openNick(after){
  openModal(`<div class="ev-icon">🐥</div><h2>닉네임 정하기</h2>
   <p>닉네임마다 농장이 따로 저장돼요. 다른 기기에서도 같은 닉네임을 넣으면 내 농장을 불러올 수 있어요.</p>
   <label class="field" for="nkIn">닉네임 (2~12자)<input id="nkIn" type="text" maxlength="12" autocomplete="off" placeholder="예: 꼬꼬농부" value="${escH(NICK)}"></label>
   <div class="gmsg" id="gmsg" role="status"></div>
   <div class="row"><button class="btn primary" type="button" id="nkOk">확인</button><button class="btn" type="button" id="gClose">취소</button></div>`);
  const inp=$('#nkIn');inp.focus();inp.select();
  const ok=async()=>{
    const n=inp.value.trim(),err=nickErr(n);if(err){gmsg(err);return}
    const changed=n!==NICK;setNick(n);
    if(CLOUD&&changed){
      gmsg('저장된 농장을 찾는 중…',true);
      try{
        const list=await CLOUD.list(),hit=list.find(x=>ownSlot(x)&&baseName(x.nickname)===n);
        if(hit){showFound(hit,after);return}
      }catch(e){/* 목록을 못 읽어도 닉네임 설정은 그대로 진행 */}
    }
    closeModal();if(after)after();
  };
  $('#nkOk').addEventListener('click',ok);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
  $('#gClose').addEventListener('click',closeModal);
}
function slotText(x){
  const m=MODES[x.mode];const when=x.savedAt?new Date(x.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  if(!m)return when;
  return `${m.name} ${Math.max(1,x.day||0)}${x.mode==='layer'?'주':'일'}${x.done?' · 완료':''}${typeof x.money==='number'?' · '+won(x.money):''} · ${when}`;
}
function showFound(hit,after){
  openModal(`<div class="ev-icon">🏡</div><h2>${escH(baseName(hit.nickname))}님의 농장이 있어요</h2>
   <div class="result">${escH(slotText(hit))}</div>
   <div class="row"><button class="btn primary" type="button" id="fdLoad">불러와서 이어하기</button><button class="btn" type="button" id="fdNew">${after?'새로 시작하기':'닫기'}</button></div>
   <div class="gmsg" id="gmsg" role="status"></div>`);
  $('#fdLoad').addEventListener('click',()=>cloudLoad(hit.nickname));
  $('#fdNew').addEventListener('click',()=>{closeModal();if(after)after()});
}
$('#btnNick').addEventListener('click',()=>openNick());
$('#btnSave').addEventListener('click',openCloud);
function gmsg(t,ok){const el=$('#gmsg');if(el){el.textContent=t;el.style.color=ok?'var(--good)':'var(--bad)'}}
function cloudNote(t,bad){const el=$('#cloudnote');if(el){el.textContent=t;el.style.color=bad?'var(--bad)':''}try{window.parent.farmGameNote&&window.parent.farmGameNote(t,bad)}catch(e){}}
async function openCloud(){
  if(!CLOUD){openModal(`<h2>☁ 저장·불러오기</h2><p>농장동물 컨설팅 유료서비스 화면에서 열어야 Firebase에 저장할 수 있어요. 지금은 이 기기에만 자동 저장돼요.</p><button class="btn" type="button" id="gClose">닫기</button>`);$('#gClose').addEventListener('click',closeModal);return}
  if(!NICK){openNick(openCloud);return}
  openModal(`<h2>☁ 저장·불러오기</h2>
   <div class="nickline" style="justify-content:flex-start">지금 닉네임 <b>${escH(NICK)}</b></div>
   <button class="btn primary" type="button" id="csSave" ${S?'':'disabled'}>${S?'지금 농장 저장하기':'시작한 농장이 없어요'}</button>
   <h3 style="font-size:16px">내 계정에 저장된 농장</h3>
   <ul class="slots" id="slots"><li class="note">불러오는 중…</li></ul>
   <div class="gmsg" id="gmsg" role="status"></div>
   <p class="note">게임을 진행하면 자동으로 저장돼요. 내 계정 안에서 닉네임별로 최대 ${CLOUD.maxSlots||10}개까지 둘 수 있어요.</p>
   <button class="btn" type="button" id="gClose">닫기</button>`);
  $('#gClose').addEventListener('click',closeModal);
  $('#csSave').addEventListener('click',async()=>{gmsg('저장 중…',true);const r=await cloudSave(false);if(r)refreshSlots('저장했어요.');});
  refreshSlots();
}
async function refreshSlots(okMsg){
  const ul=$('#slots');if(!ul)return;
  let list;
  try{list=(await CLOUD.list()).filter(ownSlot)}catch(e){ul.innerHTML='';gmsg(e.message);return}
  if(okMsg)gmsg(okMsg,true);
  if(!list.length){ul.innerHTML='<li class="note">아직 저장된 농장이 없어요.</li>';return}
  ul.innerHTML=list.map((x,i)=>`<li class="slot${baseName(x.nickname)===NICK?' me':''}"><span class="who"><b>${escH(baseName(x.nickname)||'(이름 없음)')}</b><small>${escH(slotText(x))}</small></span>
    <button class="btn primary" type="button" data-load="${i}">불러오기</button><button class="btn" type="button" data-del="${i}">삭제</button></li>`).join('');
  ul.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click',()=>cloudLoad(list[+b.dataset.load].nickname)));
  ul.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    const x=list[+b.dataset.del];
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='정말 삭제';b.style.background='var(--bad)';b.style.color='#fff';return}
    gmsg('삭제 중…',true);
    try{await CLOUD.remove(x.nickname);refreshSlots(`${baseName(x.nickname)} 농장을 지웠어요.`)}catch(e){gmsg(e.message)}
  }));
}
let cloudTimer=null,cloudBusy=false,cloudAgain=false;
function scheduleCloudSave(){
  if(!CLOUD||!NICK)return;
  clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(true),2000);
}
async function cloudSave(silent){
  if(!CLOUD||!NICK||!S)return null;
  if(cloudBusy){cloudAgain=true;return null}
  cloudBusy=true;
  try{
    if(!silent){
      const list=await CLOUD.list();
      if(!list.some(x=>x.nickname===slotName(NICK))&&list.length>=(CLOUD.maxSlots||10))throw new Error(`저장 칸이 가득 찼어요(${CLOUD.maxSlots||10}개). 안 쓰는 농장을 지워 주세요.`);
    }
    const r=await CLOUD.save(slotName(NICK),{game:S,records:R});
    cloudNote('☁ '+new Date(r.savedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 저장됨');
    return r;
  }catch(e){
    if(silent)cloudNote('☁ 저장 실패: '+e.message,true);else gmsg(e.message);
    return null;
  }finally{
    cloudBusy=false;
    if(cloudAgain){cloudAgain=false;scheduleCloudSave()}
  }
}
async function cloudLoad(nick){
  gmsg('불러오는 중…',true);
  try{
    const data=await CLOUD.load(nick);
    if(!data||!data.game||!data.game.mode)throw new Error('저장 파일이 비어 있어요.');
    if(LOCK&&data.game.mode!==LOCK)throw new Error('이 저장은 '+MODES[data.game.mode].name+' 농장이에요. 메뉴에서 해당 카드를 열어 주세요.');
    NICK=baseName(data.nickname||nick);LS.set('kkokko-nick',NICK);
    R=data.records||loadR();LS.set(lsKeyN('kkokko-records'),R);
    S=data.game;LS.set(lsKey('kkokko-autosave'),S);
    sprites=[];$('#startView').hidden=true;$('#gameView').hidden=false;
    closeModal();renderNick();render();
    cloudNote('☁ '+escH(NICK)+' 농장을 불러왔어요');toast(`${NICK}님의 농장을 불러왔어요`);
  }catch(e){gmsg(e.message)}
}

$('#modal').addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#gClose'))closeModal()});
window.claude?.hot?.snapshot?.(()=>({S}));
const boot=d=>{renderNick();$('#btnAdmin').hidden=!isAdm();if(d&&d.S){S=d.S;$('#startView').hidden=true;$('#gameView').hidden=false;render()}else{renderRecords();fetchCloudHint()}};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
requestAnimationFrame(loop);
})();
</script>
</body></html>

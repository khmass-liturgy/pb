name: 계란·육계 시세 수집

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-poultry-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 기본 라이브러리 테스트
        run: python -m unittest discover -s tests -p "test_fetch_poultry_price.py" -v
      - name: 계란·육계 시세 수집
        run: python scripts/fetch_poultry_price.py
      - name: 결과 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("poultry_price/latest.json").read_text(encoding="utf-8"))
          assert data["egg"]["rows"] and isinstance(data["egg"]["latest"], int)
          assert data["chicken"]["rows"] and isinstance(data["chicken"]["latest"], int)
          assert data["chicken"]["label"] == "생계유통(대)"
          PY
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poultry_price/latest.json
          git diff --staged --quiet && exit 0
          git commit -m "🥚🐔 계란·육계 시세 갱신"
          git push

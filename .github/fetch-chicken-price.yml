name: 한국육계협회 육계 시세 수집

on:
  schedule:
    # 평일 08:00 KST = 전날 23:00 UTC
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: fetch-chicken-price
  cancel-in-progress: false

jobs:
  fetch-chicken-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: 육계 시세 수집
        run: python scripts/fetch_chicken_price.py

      - name: 결과 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("chicken_price/latest.json")
          assert path.exists(), "latest.json이 생성되지 않았습니다."

          data = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(data.get("rows"), list), "rows가 배열이 아닙니다."
          assert len(data["rows"]) >= 1, "시세 데이터가 1건도 없습니다."

          row = data["rows"][0]
          assert row.get("date"), "최신 행에 date가 없습니다."
          assert any(row.get(k) for k in ("broiler", "chick", "breeding")), \
              "최신 행에 유효한 가격이 없습니다."

          print("검증 성공:", row)
          PY

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chicken_price/latest.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🐔 육계협회 시세 업데이트 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"

          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" &&
            git push origin "HEAD:${GITHUB_REF_NAME}" &&
            exit 0
            echo "푸시 재시도 ${i}"
            sleep 5
          done
          exit 1

name: 브리핑 뉴스 수집

on:
  schedule:
    # 평일 2시간 간격 (KST 07·09·11·13·15·17·19시), 주말은 08시 1회
    - cron: "10 22,0,2,4,6,8,10 * * 0-4"
    - cron: "10 23 * * 5,6"
  workflow_dispatch:

concurrency:
  group: fetch-briefing-news
  cancel-in-progress: false

jobs:
  fetch-briefing-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 뉴스 수집
        run: python scripts/fetch_briefing_news.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📰 브리핑 뉴스 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 다른 워크플로우가 먼저 푸시했을 수 있으므로 리베이스 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

name: debug-commons
on:
  push:
    branches: [ccr-76d8fb48-ixk3no]
    paths: ['.github/workflows/debug-commons.yml', 'scripts/_commons_fetch.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/_commons_fetch.py
      - name: commit candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/embryo/cand
          git diff --staged --quiet && echo none && exit 0
          git commit -m "temp: embryo photo candidates"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push

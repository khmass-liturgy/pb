name: 주간 계란 수급 정보 수집

on:
  schedule:
    # 매주 월요일 23:30 UTC = 화요일 08:30 KST
    # (다봄이 월요일에 업로드하므로 화요일 아침 수집)
    - cron: "30 23 * * 1"
  workflow_dispatch:  # 수동 실행

# 동시 실행 방지 (커밋 충돌 예방)
concurrency:
  group: fetch-egg-report
  cancel-in-progress: false

jobs:
  fetch-egg-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install requests pdfplumber pypdf playwright
          # 목록 페이지가 자바스크립트로 렌더링되는 경우에 대비한 최후 수단.
          # 평소엔 정적 요청만으로 끝나 이 브라우저까지 안 쓰지만, 못 찾을 때를
          # 대비해 항상 설치해둔다 (매주 1회 실행이라 설치 시간은 큰 부담이 아님).
          playwright install --with-deps chromium

      - name: 주간 계란 수급 정보 수집
        run: python scripts/fetch_egg_report.py

      - name: 결과 커밋
        if: always()   # 수집 단계가 실패해도(이전 데이터로라도) 커밋은 항상 시도
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egg_report/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🥚 주간 계란 수급 정보 업데이트 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 다른 워크플로우가 먼저 푸시했을 수 있으므로 리베이스 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

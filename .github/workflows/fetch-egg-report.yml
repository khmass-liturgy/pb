name: 주간 계란 수급 정보 수집

on:
  schedule:
    # GitHub Actions cron은 UTC: 01:00 UTC = 매일 한국시간 10:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-egg-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests pdfplumber

      - name: 계란 수급 정보 수집
        run: python scripts/fetch_egg_report.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egg_report/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🥚 주간 계란 수급 정보 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

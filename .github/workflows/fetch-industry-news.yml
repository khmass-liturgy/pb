name: 양계 업계 소식 수집

on:
  schedule:
    # 매일 한 번 — 아침에 카드로 볼 수 있게 한국시간 07:30 (22:30 UTC 전날)
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-industry-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 양계 업계 소식 수집
        run: python scripts/fetch_industry_news.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add industry_news/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📰 양계 업계 소식 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

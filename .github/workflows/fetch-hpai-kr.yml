name: 국내 AI 발생현황 수집

on:
  schedule:
    # 농식품부 「고병원성 조류인플루엔자 발생·검출 현황」은 17시 기준으로 올라오고 발생 직후
    # 올라오지 않아도 있어, 하루 두 번 확인한다. 내용이 그대로면 커밋하지 않는다.
    # 00:30 UTC = 한국시간 09:30, 09:30 UTC = 한국시간 18:30
    - cron: "30 0 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-hpai-kr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests olefile

      - name: 국내 AI 발생현황 수집
        # 농식품부가 해외 IP를 막아 국내 중계 서버(sms-relay)의 /fetch-mafra 경로로 받는다.
        # 이 경로 허용 목록에 bbs/FMD-AI2/851(발생·검출 현황 게시판)이 들어 있어야 한다.
        env:
          SMS_RELAY_URL: ${{ secrets.SMS_RELAY_URL }}
          SMS_RELAY_SECRET: ${{ secrets.SMS_RELAY_SECRET }}
        run: python scripts/fetch_hpai_kr.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hpai_kr/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🦠 국내 AI 발생현황 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

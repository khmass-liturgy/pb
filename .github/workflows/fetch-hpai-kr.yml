name: 국내 AI 발생현황 수집

on:
  schedule:
    # 농식품부 「고병원성 조류인플루엔자 발생·검출 현황」 표는 늦게 올라오므로, 발생 당일 보도자료·보도로
    # 빠르게 집계(quick)하려고 하루 네 번 확인한다. 내용이 그대로면 커밋하지 않는다.
    # 23:40 UTC = 한국시간 08:40, 03:40 UTC = 12:40, 08:40 UTC = 17:40, 12:40 UTC = 21:40
    - cron: "40 23 * * *"
    - cron: "40 3 * * *"
    - cron: "40 8 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-hpai-kr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests olefile trafilatura

      - name: 국내 AI 발생현황 수집
        # 농식품부가 해외 IP를 막아 국내 중계 서버(sms-relay)의 /fetch-mafra 경로로 받는다.
        # 이 경로 허용 목록에 bbs/FMD-AI2/851(발생·검출 현황 게시판)이 들어 있어야 한다.
        # 빠른 집계: 농식품부 보도자료 게시판(bbs/FMD-AI2/393, 중계 서버 허용 필요)과 최근 보도 본문에서
        # Claude가 확진 농장만 뽑는다(ANTHROPIC_API_KEY 없으면 건너뜀).
        env:
          SMS_RELAY_URL: ${{ secrets.SMS_RELAY_URL }}
          SMS_RELAY_SECRET: ${{ secrets.SMS_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_hpai_kr.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hpai_kr/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🦠 국내 AI 발생현황 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

      - name: Firebase Storage 업로드 (저장소 비공개 대비)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q firebase-admin
          python scripts/upload_to_storage.py hpai_kr/

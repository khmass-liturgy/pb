name: 한국육계협회 육계 시세 수집

on:
  schedule:
    # 평일 08:00 KST(23:00 UTC 전날) — 사이트가 대체로 영업일마다 갱신
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: fetch-chicken-price
  cancel-in-progress: false

jobs:
  fetch-chicken-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 육계 시세 수집
        run: python scripts/fetch_chicken_price.py

      - name: 결과 커밋
        if: always()   # 실패해도(이전값 stale 저장) 커밋은 항상 시도
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chicken_price/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🐔 육계협회 시세 업데이트 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

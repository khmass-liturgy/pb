name: 한국육계협회 육계 시세 수집

on:
  schedule:
    # 평일 08:00 KST(23:00 UTC 전날) — 사이트가 대체로 영업일마다 갱신
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: fetch-chicken-price
  cancel-in-progress: false

jobs:
  fetch-chicken-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install requests playwright
          # requests+프록시로도 접근이 안 될 때(SSLError·TLS 지문 차단 등)의
          # 최후 수단. 평소엔 안 쓰이지만 이 사이트가 그런 경우로 확인돼 추가.
          playwright install --with-deps chromium

      - name: 육계 시세 수집
        run: python scripts/fetch_chicken_price.py

      - name: 결과 커밋
        if: always()   # 실패해도(이전값 stale 저장) 커밋은 항상 시도
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # chicken_price/ 폴더가 아예 없을 수도 있으므로(수집·이전값 모두 없어
          # 저장 자체를 안 한 경우) add 실패로 워크플로우 전체가 죽지 않게 방어
          if [ -d chicken_price ]; then
            git add chicken_price/
          else
            echo "chicken_price/ 폴더 없음 — 커밋할 결과 없이 종료"
            exit 0
          fi
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🐔 육계협회 시세 업데이트 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

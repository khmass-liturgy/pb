name: 한국육계협회 육계 시세 수집

on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: fetch-chicken-price
  cancel-in-progress: false

jobs:
  fetch-chicken-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install requests playwright pytest
          playwright install --with-deps chromium

      - name: 파서 회귀 테스트
        run: pytest -q tests/test_fetch_chicken_price.py

      - name: 육계 시세 수집
        run: python scripts/fetch_chicken_price.py

      - name: 결과 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("chicken_price/latest.json").read_text(encoding="utf-8"))
          assert data.get("rows"), "시세 데이터가 없습니다."
          row = data["rows"][0]
          keys = ("large", "medium", "small", "chick", "breeding")
          assert all(isinstance(row.get(k), int) for k in keys), row
          page = Path("index.html").read_text(encoding="utf-8")
          for label in ("육계 대", "육계 중", "육계 소", "병아리", "종계노계"):
              assert label in page, label
          print("검증 성공:", row)
          PY

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chicken_price/latest.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🐔 육계 시세 갱신"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

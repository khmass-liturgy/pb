name: debug-chuksan
on:
  push:
    branches: [ccr-76d8fb48-ixk3no]
    paths: ['.github/workflows/debug-chuksan.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: dump
        run: |
          python - <<'PY'
          import sys, re
          sys.path.insert(0, "scripts")
          import requests
          import fetch_briefing_news as f
          s = requests.Session(); s.headers.update(f.HEADERS)
          r = f.get_with_proxy_fallback(s, "https://www.chuksannews.co.kr/mobile/section_list_all.html?sec_no=84", timeout=20)
          r.encoding = r.apparent_encoding or "utf-8"
          t = r.text
          print("LEN", len(t))
          idx = [m.start() for m in re.finditer(r"article\.html\?no=", t)]
          print("COUNT", len(idx))
          print("FIRST_BLOCK_START", idx[0] if idx else None)
          if idx:
              print("=====HTML-A=====")
              print(t[max(0, idx[0]-600): idx[0]+1500])
              print("=====HTML-B=====")
              print(t[max(0, idx[-1]-800): idx[-1]+800])
          PY

name: 주가·환율·곡물 시세 수집

on:
  schedule:
    # 하루 1회: 매일 07:05 UTC(=16:05 KST) — 국내장 마감(15:30) 직후, 미국장 전일 종가 반영
    - cron: "5 7 * * *"
  workflow_dispatch:

# 동시 실행 방지 (커밋 충돌 예방)
concurrency:
  group: fetch-market
  cancel-in-progress: false

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 시세 수집
        run: python scripts/fetch_market.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📈 시세 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 다른 워크플로우가 먼저 푸시했을 수 있으므로 리베이스 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

      - name: Firebase Storage 업로드 (저장소 비공개 대비)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q firebase-admin
          python scripts/upload_to_storage.py market/

name: 축산산지시세 수집

on:
  schedule:
    # GitHub Actions cron is UTC: 00:00 UTC = 매일 한국시간 09:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-poultry-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 기본 라이브러리 테스트
        run: python -m unittest tests/test_fetch_poultry_price.py -v
      - name: 계란·육계·양돈·한우 시세 수집
        run: python scripts/fetch_poultry_price.py
      - name: 결과 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("poultry_price/latest.json").read_text(encoding="utf-8"))
          assert data["egg"]["rows"] and isinstance(data["egg"]["latest"], int)
          assert data["chicken"]["rows"] and isinstance(data["chicken"]["latest"], int)
          assert data["pig"]["rows"] and isinstance(data["pig"]["latest"], int)
          assert data["cow"]["items"]
          assert data["chicken"]["label"] == "생계유통(대)"
          assert data["pig"]["label"] == "농가수취 평균"
          assert data["cow"]["items"]["female_calf"]["label"] == "암송아지(6~7개월)"
          assert data["cow"]["items"]["male_calf"]["label"] == "수송아지(6~7개월)"
          assert data["cow"]["items"]["farm_receipt_600kg"]["label"] == "농가수취가격(600kg)"
          for key in ("female_calf", "male_calf", "farm_receipt_600kg"):
              assert isinstance(data["cow"]["items"][key]["value"], int)
          # 육계 대/중/소 규격별 — '대'는 기존 chicken.latest와 사실상 같은
          # 시세라 항상 값이 있어야 한다. 중·소는 거래가 뜸해 없을 수 있으므로
          # 필수로 강제하지 않는다(화면도 값이 있는 규격만 보여준다).
          if "chicken_grades" in data:
              g = data["chicken_grades"]["items"]
              assert isinstance(g["large"]["value"], int)
          # 계란 수도권도 대/중/소와 같은 원칙 — 있으면 좋은 보조 값이라
          # 없어도(latest가 None이어도) 전체 실행을 막지 않는다.
          if "egg_region" in data:
              assert data["egg_region"]["region"] == "수도권"
          PY
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poultry_price/latest.json
          git diff --staged --quiet && exit 0
          git commit -m "📊 축산산지시세 갱신"
          git push

name: 지점 날씨 예보 수집

on:
  schedule:
    # 하루 4번 — 한국시간 05:20·11:20·17:20·23:20 (UTC 20:20·02:20·08:20·14:20)
    - cron: "20 20,2,8,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather-cities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 지점 날씨 예보 수집
        run: python scripts/fetch_weather_cities.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🌤️ 지점 날씨 예보 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

      - name: Firebase Storage 업로드 (저장소 비공개 대비)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q firebase-admin
          python scripts/upload_to_storage.py weather/

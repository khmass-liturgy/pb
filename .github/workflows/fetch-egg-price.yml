name: KAPE 다봄 계란 산지가격 수집

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-egg-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install requests pytest
      - name: 수집기 테스트
        run: pytest -q tests/test_fetch_egg_price.py
      - name: 계란 산지가격 수집
        run: python scripts/fetch_egg_price.py
      - name: 결과 검증
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("egg_price/latest.json").read_text(encoding="utf-8"))
          assert data["unit"] == "원/10개"
          assert data["grade"] == "특란 (XL)"
          assert data["rows"] and isinstance(data["rows"][0]["farm_per_10"], int)
          PY
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egg_price/latest.json
          git diff --staged --quiet && exit 0
          git commit -m "🥚 계란 특란 XL 산지가격 갱신"
          git push

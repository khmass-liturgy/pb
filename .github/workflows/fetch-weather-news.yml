name: 날씨 뉴스 수집

on:
  schedule:
    # 하루 1번 — 한국시간 06:10 (UTC 21:10). 2026-10: 하루 6번에서 축소
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests trafilatura

      - name: 날씨 뉴스 수집
        # 요약은 Claude(ANTHROPIC_API_KEY — 업계 소식·기술탐구와 같은 저장소 시크릿)로 만들고, 키가 없으면 본문 앞부분으로 대신한다
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_weather_news.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_news/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "🌦️ 날씨 뉴스 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1

      - name: Firebase Storage 업로드 (저장소 비공개 대비)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q firebase-admin
          python scripts/upload_to_storage.py weather_news/

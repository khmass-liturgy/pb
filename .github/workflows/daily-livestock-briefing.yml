name: 🐄 축산·수의 일일 브리핑

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 오전 8시 KST (= 전날 23:00 UTC)
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # models: read 는 GitHub Models 전용 권한이었으나
      # 해당 서비스가 2026-07-30 자로 종료되어 제거함

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate daily briefing
        env:
          # 등록된 키에 따라 자동 선택 (gemini → groq → openai 순)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 특정 제공자·모델 강제 지정이 필요할 때만 설정
          # AI_PROVIDER: gemini
          # AI_MODEL: gemini-2.5-pro
        run: python scripts/generate_briefing.py

      - name: Commit and push briefing
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add briefings/ README.md
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 축산·수의 일일 브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 5
          done
          exit 1
